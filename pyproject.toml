[project]
name = "numera"
version = "0.0.0"
description = "Natural-language questions over a read-only finance warehouse"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "sqlglot>=26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
numera = ["infrastructure/*.sql", "infrastructure/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
